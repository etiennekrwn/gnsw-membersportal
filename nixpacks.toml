# Railway/Nixpacks config for gnsw-membersportal.
# Pin a Node version that supports Vite 8 (required: 20.19+ / 22.12+).
# Without this, Nixpacks auto-detects Node 18, and `vite build` fails with
# "ReferenceError: CustomEvent is not defined".
[providers]
  nodejs = true

[variables]
  NIXPACKS_NODE_VERSION = "22"

[phases]
  [phases.setup]
    nixPkgs = ["nodejs_22"]
  [phases.install]
    commands = ["npm ci"]
  [phases.build]
    commands = ["npm run build"]

[start]
  cmd = "node server.js"